[input]
entrypoint = 0x80000400
symbols_file_path = "generated/40winks.syms.toml"
rom_file_path = "baserom.z64"
output_func_path = "generated/RecompiledFuncs"
recomp_include = "#include \"recomp_support.h\""
functions_per_output_file = 100

[patches]
stubs = []
ignored = []

# Host memory is coherent, so the N64 CPU cache-maintenance operations are NOPs.
instruction = [
    { func = "func_800339A0", vram = 0x800339E0, value = 0x00000000 },
    { func = "func_800339A0", vram = 0x80033A04, value = 0x00000000 },
    { func = "func_800339A0", vram = 0x80033A14, value = 0x00000000 },
    { func = "func_800339A0", vram = 0x80033A38, value = 0x00000000 },
    { func = "func_80033A50", vram = 0x80033A60, value = 0x00000000 },
    { func = "func_8003FC00", vram = 0x8003FC38, value = 0x00000000 },
    { func = "func_8003FC00", vram = 0x8003FC5C, value = 0x00000000 },
    { func = "func_8003FC80", vram = 0x8003FCB8, value = 0x00000000 },
    { func = "func_8003FC80", vram = 0x8003FCDC, value = 0x00000000 },
]

# The game performs a private raw-SI probe for unusual controller types after
# osContInit. ModernRuntime exposes a normal controller through the public API,
# so report that same result without touching console SI registers.
[[patches.hook]]
func = "func_80031210"
text = "ctx->r2 = 0; return;"

# This function adjusts $ra in two JAL delay slots to select exactly one EDL
# decoder. A direct C call returns to the next generated statement instead, so
# reproduce the original dispatch in a small host shim.
[[patches.hook]]
func = "func_80013A18"
text = "dispatch_edl_decode(rdram, ctx); return;"

# This initializer walks a table of absolute labels with `jr $v0`. The table is
# advanced across loop iterations, so N64Recomp cannot recognize it as an
# indexed jump table. Preserve both original targets inline and rejoin their
# shared loop tail instead of treating the labels as function pointers.
[[patches.hook]]
before_vram = 0x80006FF0
func = "func_80006F70"
text = "if (ctx->r2 == S32(0x80006FF8) || ctx->r2 == S32(0x80007018)) { ctx->r1 = S32(0x801C << 16); ctx->r1 = ADD32(ctx->r1, ctx->r3); MEM_W(0x22C4, ctx->r1) = (ctx->r2 == S32(0x80006FF8)) ? 0 : ctx->r10; ctx->r1 = S32(0x801C << 16); ctx->r1 = ADD32(ctx->r1, ctx->r3); MEM_W(0x22D0, ctx->r1) = (ctx->r2 == S32(0x80006FF8)) ? ctx->r11 : ctx->r10; ctx->r3 = ADD32(ctx->r3, 0x24); goto L_80007034; }"

# Host graphics completion can reach the scheduler before the startup threads
# finish their black-screen requests. Do not consume the one-time unblack flag
# on the initial task that has no framebuffer; the first real swap will use it.
[[patches.hook]]
before_vram = 0x80036ED0
func = "func_80036E80"
text = "if (MEM_W(0xC, ctx->r16) == 0) { goto L_80036EF0; }"

# ModernRuntime's parallel host threads can issue these startup black requests
# after the first graphics completion. Re-arm the game's own first-frame flag
# so the next real framebuffer swap performs the matching osViBlack(0).
[[patches.hook]]
before_vram = 0x80001C8C
func = "func_80001C74"
text = "MEM_W(0x140C, S32(0x8009 << 16)) = 1;"

[[patches.hook]]
before_vram = 0x80001FD8
func = "runtime_event_thread_entry"
text = "MEM_W(0x140C, S32(0x8009 << 16)) = 1;"

[[patches.hook]]
before_vram = 0x800020CC
func = "child_runtime_thread_entry"
text = "MEM_W(0x140C, S32(0x8009 << 16)) = 1;"

[[patches.hook]]
