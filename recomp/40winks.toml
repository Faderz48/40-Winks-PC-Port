text = "yield_self(rdram);"

[[patches.hook]]
before_vram = 0x80001DE4
func = "func_80001CA0"
text = "yield_self(rdram);"

# Scene changes wait for the runtime-state owner to clear 0x80082B40. The N64
# scheduler can preempt this tight loop; ModernRuntime scheduling is cooperative.
[[patches.hook]]
before_vram = 0x80002E98
func = "func_80002E80"
text = "yield_self(rdram);"

# Gameplay scene setup waits for both alternating frame-workspace owners to
# release their slots. These are preemptible spins on N64 and must cooperate
# with ModernRuntime's host-thread scheduler.
[[patches.hook]]
