# N64ModernRuntime currently exposes rumble but no Controller Pak filesystem.
# Keep the game's asynchronous save state machine and service only its PFS
# commands through persistent host storage.
[[patches.hook]]
before_vram = 0x8002E044
func = "first_frame_tick"
text = "dispatch_debug_level_command(rdram, ctx); if (dispatch_controller_pak_command(rdram, ctx)) { goto L_8002E314; }"

# The original detector treats memory and rumble as mutually exclusive because
# only one physical accessory fits in an N64 controller. The PC bridge supports
# both, so expose the combined virtual accessory immediately.
[[patches.hook]]
func = "func_8002B25C"
text = "activate_virtual_controller_accessory(rdram, ctx); return;"

# These loops wait for a counter advanced by the VI interrupt thread. Yield at
# each back-edge so ModernRuntime can deliver that asynchronous interrupt.
[[patches.hook]]
before_vram = 0x80002344
func = "func_80002320"
text = "yield_self(rdram);"

[[patches.hook]]
before_vram = 0x80002378
func = "func_80002320"
text = "yield_self(rdram);"

[[patches.hook]]
